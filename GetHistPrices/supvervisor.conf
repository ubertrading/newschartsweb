[program:GetHistPrices]
command = /opt/newschartsweb/GetHistPrices/GetHistPrices
autostart = true
startsecs = 5
autorestart = true
user = newschartsweb
directory = /opt/newschartsweb/GetHistPrices/
environment = LD_LIBRARY_PATH="/opt/newschartsweb/GetHistPrices"
# by default, log files are rotated when they grow to 50MB and 10 past copies are kept
stdout_logfile = /opt/newschartsweb/GetHistPrices/stdout
stderr_logfile = /opt/newschartsweb/GetHistPrices/stderr
